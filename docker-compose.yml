version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flranked-db
    environment:
      POSTGRES_USER: flranked
      POSTGRES_PASSWORD: flranked
      POSTGRES_DB: flranked
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
